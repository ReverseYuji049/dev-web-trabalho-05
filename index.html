<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: sans-serif;
            background: #ff7b00;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        #pesquisa {
            margin: 100px;
            background: white;
            padding: 20px;
            width: 100%;
            max-width: 700px;
            border-radius: 10px;
        }

        fieldset {
            border: 1px solid #ccc;
            border-radius: 10px;
            margin-bottom: 10px;
            padding: 10px;
        }

        legend {
            font-weight: bold;
        }

        label{
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        #button {
            display: flex;
            justify-content: center;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        #submit {
            background: #ff7b00;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            justify-content: center;
            display: flex;
            margin-top: 15px;
        }

        #submit:hover {
            background: #ff7b00;
        }
        .checkbox-group {
            margin-top: 10px;
        }
        .checkbox-group label {
            display: inline;
            margin-left: 5px;
        }

        input[type="checkbox"]{
            accent-color: #ff7b00;
        }

        textarea{
            resize: vertical;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea,
        input[type="file"]{
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input:focus,
        select:focus,
        textarea:focus{
            outline: none;
            border-color: #ff7b00;
            box-shadow: none;
        }

        @media(max-width: 600px){
            .buttons{
                flex-direction: column;
            }

            button{
                width: 100%;
            }
        }

    </style>
</head>
<body>
    <div id="pesquisa">
        <h1>Pesquisa UniFil</h1>
        <form>
            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="nome">Nome: </label>
                <input type="text" id="nome" name="nome" placeholder="Digite o seu nome" required>

                <label for="email">E-mail: </label>
                <input type="email" id="email" name="email" placeholder="Digite o seu e-mail" required>

                <label for="senha">Senha: </label>
                <input type="password" id="senha" name="senha" placeholder="Digite a sua senha" required>

                <label for="nascimento">Data de nascimento: </label>
                <input type="date" id="nascimento" name="nascimento" required>

                <label for="sexo">Sexo: </label>
                <select id="sexo" name="sexo" required>
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                    <option value="NB">Não-binário</option>
                    <option value="others">Outros</option>
                    <option value="NOT">Prefiro não informar</option>
                </select>
            </fieldset>
            <fieldset>
                <legend>Informações Acadêmicas</legend>
                <label for="curso">Curso: </label>
                <select id="curso" name="curso" required>
                    <option value="ENSW">Engenharia de Software</option>
                    <option value="CC">Ciência da Computação</option>
                    <option value="ADS">Análise e Desenvolvimento de Sistemas</option>
                </select>

                <label>Interesses:</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="interesse1">
                    <label for="interesse1">Desenvolvimento Web</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="interesse2">
                    <label for="interesse2">Cibersegurança</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="interesse3">
                    <label for="interesse3">Engenharia de Software</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="interesse4">
                    <label for="interesse4">Desenvolvimento de Jogos</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="interesse5">
                    <label for="interesse5">Banco de Dados</label>
                </div>

                <label for="comentarios">Comentários: </label>

                <textarea id="comentarios" name="message" cols="30" rows="10"></textarea>

                <label for="foto">Upload de foto: </label>
                <input type="file" name="imagem" id="foto">
            </fieldset>
            <div id="button">
                <input type="submit" value="Enviar" id="submit">
            </div>
        </form>
    </div>
</body>
</html>
